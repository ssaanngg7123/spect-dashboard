<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부동산 외부지표 모니터링</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"><style>
:root{
  --bg:#f3f2f2; --surface:#eae9e9; --text:#201e1d;
  --accent:#0088b0; --warn:#d6006c;
  --rule:#c9c6c6; --hair:#dedbdb;
  --n600:#7d7979; --n700:#605d5d;
  --a100:#e9f8ff; --a200:#cbeeff; --a300:#99e0ff; --a700:#006786; --a800:#004961;
  --w100:#fff1f4; --w200:#ffdee6; --w700:#aa0b56; --w800:#790e3d;
  --bar:#0088b0; --bar-lo:#99e0ff;
  --font:"Source Serif 4",ui-serif,Georgia,"Times New Roman",serif;
  --r:2px;
}
/* 시스템=다크 (스탬프 없음) — 명시적 라이트 선택이 이기도록 가드 */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141313; --surface:#1f1e1e; --text:#ecebea;
  --accent:#3ab6d8; --warn:#ff6aa4;
  --rule:#3d3a3a; --hair:#2b2929;
  --n600:#8e8a8a; --n700:#aaa6a6;
  --a100:#0d2f3c; --a200:#12455a; --a300:#1d6d8b; --a700:#7fd4ef; --a800:#a8e4f7;
  --w100:#3a1223; --w200:#521a31; --w700:#ff9ec0; --w800:#ffc0d6;
  --bar:#2f9dbd; --bar-lo:#1d5f76;
}}
/* 토글이 반대 방향으로도 이기도록 */
:root[data-theme="dark"]{
  --bg:#141313; --surface:#1f1e1e; --text:#ecebea;
  --accent:#3ab6d8; --warn:#ff6aa4;
  --rule:#3d3a3a; --hair:#2b2929;
  --n600:#8e8a8a; --n700:#aaa6a6;
  --a100:#0d2f3c; --a200:#12455a; --a300:#1d6d8b; --a700:#7fd4ef; --a800:#a8e4f7;
  --w100:#3a1223; --w200:#521a31; --w700:#ff9ec0; --w800:#ffc0d6;
  --bar:#2f9dbd; --bar-lo:#1d5f76;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;background:none}
a{color:var(--a700);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.mast{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1.5px solid var(--text)}
.mast .in{max-width:720px;margin:0 auto;padding:13px 18px 11px}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--a700)}
.mast h1{margin:2px 0 0;font-weight:600;letter-spacing:-.025em;
  line-height:1.12;text-wrap:balance;font-size:19px}
.mast h1.lg{font-size:27px}
main{max-width:720px;margin:0 auto;padding:0 18px 96px}
/* 마스트헤드 가로줄 밑 첫 줄이 너무 붙어 보이는 화면(홈·요약)에만 여백을 준다 */
main.pt{padding-top:18px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);
  border-top:1.5px solid var(--text)}
nav .in{max-width:720px;margin:0 auto;display:flex}
nav button{flex:1;border:0;padding:9px 2px 10px;min-height:58px;display:flex;
  flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--n600);
  border-top:3px solid transparent;margin-top:-1.5px;position:relative}
nav button[aria-current="page"]{color:var(--text);border-top-color:var(--accent);font-weight:600}
nav .ic{font-size:16px;line-height:1}
nav .bd{position:absolute;top:5px;left:calc(50% + 8px);background:var(--warn);
  color:var(--bg);border-radius:9px;font-size:10px;padding:0 5px;line-height:15px;font-weight:600}
/* 정보 탭 하위 메뉴의 경고 수 — nav 배지는 절대 배치라 칩 안에서는 스타일이
   붙지 않아 숫자가 맨글씨로 남는다. 칩 안에서는 글자 옆 알약으로 둔다 */
.chip .bd{display:inline-block;background:var(--warn);color:var(--bg);
  border-radius:9px;font-size:10px;padding:0 5px;line-height:15px;font-weight:600;
  margin-left:3px;vertical-align:1px}
.chip[aria-pressed="true"] .bd{background:var(--bg);color:var(--accent)}

h2{margin:24px 0 3px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--a700);font-weight:600}
/* 검증 탭 제목 3개만 — 작은 대문자 라벨 대신 눈에 띄는 굵은 제목으로 */
h2.h2lg{font-size:18px;letter-spacing:-.01em;text-transform:none;font-weight:700}
.sub{font-size:13px;color:var(--n700);margin:0 0 12px;max-width:60ch}

/* 홈 목록 — 이름·출처를 위에, 값과 스파크라인을 아래에 두는 2단 구조.
   375px 에서 이름·기준월·출처·지역·값·전월비·차트를 한 줄에 넣을 수 없다. */
.row{position:relative;border-bottom:1px solid var(--hair)}
.rm{display:block;width:100%;text-align:left;border:0;padding:15px 0 14px}
.rm:active{background:var(--a100)}
.nm{font-weight:600;font-size:21px;letter-spacing:-.015em;line-height:1.2;
  display:block;text-wrap:balance}
.rm .nm{padding-right:38px}
.paren{font-weight:400;font-size:12px;color:var(--n600);letter-spacing:.02em}
.big .paren{font-size:13px}
.src{display:block;font-size:12px;color:var(--n700);margin-top:4px}
.btm{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:11px}
.qb{position:absolute;top:14px;right:0;width:30px;height:30px;padding:0;
  border:1px solid var(--rule);border-radius:50%;font-size:13px;font-weight:600;
  color:var(--n700);display:flex;align-items:center;justify-content:center;line-height:1}
.qb[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.help{background:var(--surface);border-left:3px solid var(--accent);
  padding:11px 13px;margin:0 0 15px;font-size:12.5px;line-height:1.65;color:var(--n700)}
.help b{color:var(--text);font-weight:600}
/* about 화면 원천 목록 — 홈 .row 와 구조가 다르다. 펼치기 버튼이라 button 기본
   테두리만 지우고 구분선(border-bottom)은 그대로 살린다 */
.srow{display:flex;align-items:center;gap:12px;width:100%;
  border-width:0 0 1px;border-style:solid;border-color:var(--hair);
  padding:12px 0;min-height:54px;text-align:left}
.mt{font-size:12px;color:var(--n700);margin-top:3px}
.vw{text-align:right;flex:none}
.vr{display:flex;align-items:baseline;justify-content:flex-end;gap:6px}
.rg{font-weight:600;font-size:12px;color:var(--n700);white-space:nowrap}
.rg:empty{display:none}
.vl{font-weight:600;font-size:21px;white-space:nowrap;line-height:1.1}
.dl{font-size:12px;white-space:nowrap}
/* 홈 탭 다섯 항목의 값 줄("전국 102.17(전월비 +0.41%)")만 1.3배 — 요약 헤더·
   과거자료 표 등 같은 클래스를 쓰는 다른 화면은 그대로 둔다 */
.row .rg{font-size:15.6px}
.row .vl{font-size:27.3px}
.row .dl{font-size:15.6px}
.up{color:var(--text)} .dn{color:var(--w700)}
.spark{display:flex;align-items:flex-end;gap:1.5px;height:46px;
  border-bottom:1px solid var(--hair)}
.spark i{flex:1;background:var(--bar-lo);min-height:2px}
.spark i:last-child{background:var(--warn)}
.sw{width:96px;flex:none}
/* 최신월 라벨을 마지막 막대 밑에 정확히 맞춘다 — 막대와 같은 그리드를 깐다 */
.stk{display:grid;margin-top:3px}
.stk span{font-size:11px;color:var(--w700);white-space:nowrap;display:flex;
  justify-content:flex-end;overflow:visible}

.tag{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;
  border-radius:var(--r);white-space:nowrap}
.t-a{background:var(--a200);color:var(--a800)}
.t-m{background:var(--w200);color:var(--w800)}
.card{background:var(--surface);border-radius:var(--r);padding:15px;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 5px}
.chip{border:1px solid var(--rule);border-radius:var(--r);padding:8px 11px;
  min-height:40px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--bg);font-weight:600}
/* 지역 선택 — 칩 줄 첫 칸에 칩과 똑같은 크기로 세운다. 고른 지역은 칩이 눌린
   상태로 보여주므로 이 컨트롤은 "지역 선택" 한 문구로 고정한다 — 폭이 지역명
   길이에 흔들리지 않아야 칩과 한 줄로 맞는다 */
.chips select.chip{width:auto;font-family:var(--font);font-size:13px;
  color:var(--text);background-color:var(--bg);padding:8px 11px;
  appearance:none;-webkit-appearance:none;text-align:left}
.big{font-weight:600;font-size:34px;letter-spacing:-.025em;line-height:1.04}
.bar{display:flex;align-items:flex-end;gap:2px;height:88px;margin:14px 0 5px;
  border-bottom:1.5px solid var(--text)}
.bar i{flex:1;background:var(--bar);min-height:2px}
.bar i.last{background:var(--warn)}

/* 요약 차트 — 값 라벨을 막대 자신의 꼭대기에 붙인다(각 막대 높이를 그대로 따라간다).
   아래 연도 눈금만 별도 행으로 그리드에 맞춘다 */
.gc{display:grid;align-items:flex-end}
.gb{height:96px;border-bottom:1.5px solid var(--text);align-items:flex-end}
.gb i{background:var(--bar);min-height:2px;display:block;position:relative}
.gb i.last{background:var(--warn)}
.gv{position:absolute;font-size:10px;white-space:nowrap;line-height:1.3;
  text-align:center;pointer-events:none}
.gv b{font-weight:600;color:var(--text)}
.gt{font-size:10px;color:var(--n600);white-space:nowrap;margin-top:4px;height:13px;
  display:flex;overflow:visible}
/* 상세 화면 차트 — 라벨이 최저·최고 둘뿐이라 요약 차트보다 크게 쓴다 */
.gv.d{font-size:11.5px}

.nm.sm{font-size:19px}
.nm.sm .paren{display:inline;margin:0}
.ins{margin:9px 0 4px;padding:0 0 0 15px;list-style:none;font-size:15px;
  color:var(--n700);line-height:1.6}
.ins li{position:relative;margin:3px 0}
.ins li::before{content:"·";position:absolute;left:-13px;color:var(--accent);font-weight:600}
.ins b{color:var(--text);font-weight:600}
.chip.sm{padding:6px 9px;min-height:34px;font-size:12px}
/* 권역 설명 — 차트와 표 사이. 고른 권역 하나만 「*강북14개구 ?」로 접어 둔다 */
.zq{display:flex;align-items:center;gap:8px;border:0;padding:12px 0 11px;
  font-size:13px;font-weight:600;color:var(--n700)}
.qb.st{position:static;width:22px;height:22px;font-size:12px;flex:none}
.zq[aria-expanded="true"] .qb.st{background:var(--accent);border-color:var(--accent);
  color:var(--bg)}
.news{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.news a{display:inline-flex;align-items:center;gap:5px;font-size:12px;
  border:1px solid var(--rule);border-radius:var(--r);padding:6px 10px;min-height:34px}
.news a:hover{border-color:var(--accent);color:var(--accent)}
/* 기사별 링크 — 제목이 길어 칩으로 늘어놓을 수 없다. 한 줄에 한 건씩 세우고
   어느 언론사·언제 기사인지를 오른쪽에 붙여 누르기 전에 알 수 있게 한다 */
.news.art{display:block;margin-top:12px;border-top:1px solid var(--hair)}
.news.art a{display:flex;align-items:baseline;gap:10px;border:0;border-radius:0;
  border-bottom:1px solid var(--hair);padding:9px 0;min-height:0;
  font-size:13.5px;line-height:1.45;color:var(--text)}
.news.art a:hover{color:var(--a700);border-color:var(--rule)}
.news.art a::before{content:"▸";color:var(--accent);flex:none}
.news.art .nt{flex:1;min-width:0}
.news.art .np{flex:none;font-size:11px;color:var(--n600);white-space:nowrap}
/* 뉴스 탭 — 같은 사안 묶음. 관련 기사는 대표 밑에 들여 접어둔다 */
.news.art .relb{border:0;background:none;padding:4px 0 10px 14px;font-size:12px;
  color:var(--a700);display:block;text-align:left;min-height:0}
.news.art .rel{padding-left:14px;border-left:2px solid var(--rule);margin:0 0 10px 2px}
.news.art .rel a{padding:7px 0;font-size:13px}
.news.art .rel a::before{content:"·"}
.news.art .rel .np{font-size:10.5px}
/* 뉴스 탭 — 기사가 어느 키워드로 걸렸는지 제목 밑에 적는다 */
.news.art .kwt{display:block;font-size:11px;color:var(--a700);margin-top:3px;
  font-weight:400;letter-spacing:.02em}
@media (max-width:430px){.news.art .np{font-size:10.5px}}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:340px}
th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--n700);
  font-weight:400;text-align:right;padding:8px 0;border-bottom:1.5px solid var(--text)}
th:first-child{text-align:left}
td{padding:9px 0;border-bottom:1px solid var(--hair);text-align:right;font-size:15px}
td:first-child{text-align:left;color:var(--n700);font-size:14px}
/* 상세 화면 과거자료 표 — 네 칸을 균등 폭으로 고정하고 글자를 키운다.
   검증 화면 표(지역·KB·부동산원·편차)는 폭이 제각각이라 건드리지 않는다 */
table.hist{table-layout:fixed}
table.hist th{font-size:12.5px;letter-spacing:.03em;text-transform:none;width:25%}
/* 월·값 두 칸은 가운데 정렬 — 전월비·전년동월비는 오른쪽 정렬 그대로 두고 글자만 키운다 */
table.hist th:nth-child(1),table.hist th:nth-child(2),
table.hist td:nth-child(1),table.hist td:nth-child(2){text-align:center}
table.hist td{font-size:18px;padding:11px 0}
table.hist td:first-child{font-size:17px}
.more{width:100%;border:0;border-bottom:1px solid var(--hair);padding:13px 0;
  min-height:46px;display:flex;align-items:center;gap:10px;font-weight:600;
  font-size:14px;color:var(--a700)}
.more span:nth-child(2){flex:1;height:1px;background:var(--hair)}
.alert{background:var(--w100);border-left:3px solid var(--warn);padding:12px 13px;
  margin:13px 0;font-size:13px;line-height:1.55}
/* 경락율 제거 내역 — 지역으로 묶고 건마다 감정가·매각가·사유·시도값 변화를 남긴다 */
.rmg{display:flex;align-items:baseline;gap:8px;width:100%;border:0;
  border-bottom:1.5px solid var(--text);margin:16px 0 0;padding:9px 0 6px;
  text-align:left;font-weight:600;font-size:15px;min-height:42px}
.rmg span{font-size:12px;color:var(--n600);font-weight:400}
.rmg .rmn{flex:1;font-size:15px;color:var(--text);font-weight:600}
.rmg .rmx{color:var(--a700);font-size:13px}
.rmg[aria-expanded="true"] .rmn{color:var(--a700)}
.rmi{padding:11px 0 12px;border-bottom:1px solid var(--hair)}
.rmh{display:flex;align-items:baseline;gap:9px;font-size:14px;margin-bottom:4px}
.rmr{margin-top:6px;font-size:13px}
.rmr strong{color:var(--a800)}
/* 본문 안에서 링크처럼 눌리는 버튼 — 검증 탭으로 보내는 안내에 쓴다 */
.lk{border:0;padding:0;font-size:inherit;color:var(--a700);text-decoration:underline}
.foot{font-size:11px;color:var(--n700);padding:20px 0 8px;line-height:1.65;
  border-top:1px solid var(--hair);margin-top:22px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
@media (max-width:430px){
  .nm{font-size:19px} .vl{font-size:19px} .sw{width:84px} .spark{height:42px}
  .rg{font-size:11px}
  .gb{height:78px}
  .row .rg{font-size:14.3px}
  .row .vl{font-size:24.7px}
}
</style>
</head>
<body>

<div class="mast"><div class="in">
  <div class="eyebrow" id="eb"></div><h1 id="ttl">주담대 외부지표</h1>
</div></div>

  auction: "https://www.courtauction.go.kr",
  cpi:     "https://ecos.bok.or.kr",
  trx_apt: "https://www.reb.or.kr",
};
const SPANS = [[6,"6개월"],[12,"1년"],[36,"3년"],[60,"5년"]];
/* 지표 탭에 칩으로 세우는 주요 지역. 나머지는 "지역 선택" 목록으로 내린다 —
   19~20개를 다 칩으로 깔면 정작 볼 값이 화면 밖으로 밀린다 */
const MAJOR = ["전국","서울","경기","인천","부산","대구","광주","대전"];
/* KB 가 주는 권역 순서(강북→강남→수도권→6개→5개→기타)는 읽는 순서가 아니다 */
/* 5개광역시는 화면에서 내렸다 (build_dashboard HIDE_AVG) — 6개광역시와 나란히
   두면 어느 쪽을 봐야 하는지가 매번 질문이 된다. 계열 자체는 항등식 검증에 남아
   있어 검증 탭 경고에는 그대로 등장한다 */
const ZONE_ORDER = ["수도권","강남11개구","강북14개구","6개광역시","기타지방"];
const ZONE_DESC = {
  "수도권":     "서울 · 인천 · 경기",
  "강남11개구": "서울 한강 이남 — 강남·서초·송파·강동·관악·동작·영등포·강서·양천·구로·금천",
  "강북14개구": "서울 한강 이북 — 종로·중구·용산·성동·광진·동대문·중랑·성북·강북·도봉·노원·은평·서대문·마포",
  "6개광역시":  "부산 · 대구 · 광주 · 대전 · 울산 · 인천",
  "기타지방":   "수도권·광역시를 제외한 지방 — 세종 포함 여부 등 정확한 구성은 KB 공표 기준 확인 필요 (미결)",
};
/* 차트 폭 — 375px 화면에서 실측 339px. 넓은 화면에서는 라벨이 실제보다 덜
   붙어 보수적으로(라벨을 덜) 동작한다 — 겹치는 쪽으로는 틀리지 않는다 */
const W_CHART = 339;
/* 라벨 폭은 어림하지 않고 캔버스로 잰다. 글자수 × 상수로 어림하면 한글·쉼표·
   소수점 때문에 30% 가까이 빗나가 들어갈 라벨을 버린다 (실측 확인) */
let _cx=null, _wm={};
function textW(t,big){
  const key=(big?"d|":"n|")+t;
  if(_wm[key]!=null) return _wm[key];
  if(!_cx) _cx=document.createElement("canvas").getContext("2d");
  _cx.font=`600 ${big?11.5:10}px ${getComputedStyle(document.body).fontFamily}`;
  return (_wm[key]=_cx.measureText(t).width+5);
}
const E = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = { tab:"home", ind:"kb_idx", reg:null, past:false, grp:null, span:12,
          help:{}, sreg:"전국", news:{}, zhelp:false, ahelp:false, rmo:{}, src:{},
          cross:false, sec:"info", kw:null, cl:{} };

const fmt = (v,d) => v==null ? "—"
  : d.nd===0 ? Math.round(v).toLocaleString("ko-KR") : v.toFixed(d.nd);
const unitTxt = (u,tight) => u
  ? `<span style="font-size:.62em;font-weight:400">${tight?"":" "}${E(u)}</span>` : "";
const unit = d => unitTxt(d.unit);
/* 홈 전용 축약 표기 — 1만 미만은 자릿수를 잃으므로 원래 단위로 남긴다.
   세 번째 값은 "값과 단위를 붙여 쓸지" — 축약형만 붙여 쓴다 (5.5만 호) */
function fmtHome(id,v,d){
  if(v==null) return ["—","",false];
  if(id==="trx_apt")
    return v>=10000 ? [(v/10000).toFixed(1),"만 호",true]
                    : [Math.round(v).toLocaleString("ko-KR"),"호",false];
  if(id==="avg")
    return v>=10000 ? [(v/10000).toFixed(1),"억",true]
                    : [Math.round(v).toLocaleString("ko-KR"),"만원",false];
  return [fmt(v,d), d.unit, false];
}
const series = (id,r) => P.ind[id].series[r] || {};
/* 기준시점 병기 — 지수는 이 표기 없이는 수치를 읽을 수 없다 */
const paren = id => BASE[id] ? `<span class="paren">  (${E(BASE[id])})</span>` : "";
/* 202607 → '26.7월. 화면의 모든 월 표기는 이 함수를 지난다 */
const shortM = m => m ? `'${E(m.slice(2,4))}.${Number(m.slice(4))}월` : "—";
/* 원 단위 금액 → 억/만원. 4,480,000,000 을 그대로 세우면 자릿수를 셀 수 없다 */
const eok = v => v==null ? "—"
  : v>=1e8 ? (v/1e8).toFixed(1).replace(/\.0$/,"")+"억원"
  : v>=1e4 ? Math.round(v/1e4).toLocaleString("ko-KR")+"만원"
  : Math.round(v).toLocaleString("ko-KR")+"원";

/* 기본 지역은 전국. 다섯 지표 모두 전국 계열을 갖고 있다 (CPI 는 전국뿐) */
function defReg(id){
  const d=P.ind[id];
  if (d.series["전국"]) return "전국";
  const g=d.groups;
  for (const k of ["전국","시도","전체"]) if (g[k]&&g[k].length) return g[k][0];
  return Object.keys(d.series)[0];
}
const labelOf = (id,r) => (P.ind[id].label && P.ind[id].label[r]) || r;
/* 홈의 지역 라벨. 소비자물가지수는 전국 단일 계열이라 지역을 붙이지 않는다 */
const regLabel = (id,r) => id==="cpi" ? "" : labelOf(id,r);
function last(id,r){
  const d=P.ind[id], s=series(id,r);
  for (let i=d.months.length-1;i>=0;i--){const m=d.months[i]; if(s[m]!=null) return [m,s[m],i];}
  return [null,null,-1];
}
const rate = (c,p) => (c==null||p==null||p===0) ? null : (c/p-1)*100;
const pct = p => p==null ? `<span class="dl">—</span>`
  : `<span class="dl ${p<0?"dn":"up"}">${p>=0?"+":""}${p.toFixed(2)}%</span>`;

function spark(id,r,n){
  const d=P.ind[id], s=series(id,r);
  const ms=d.months.filter(m=>s[m]!=null).slice(-(n||12));
  if(!ms.length) return "";
  const vs=ms.map(m=>s[m]), lo=Math.min(...vs), hi=Math.max(...vs), rr=(hi-lo)||1;
  const g=`grid-template-columns:repeat(${vs.length},1fr);gap:1.5px`;
  /* 눈금을 막대와 같은 그리드에 깔고 마지막 칸에만 넣는다 —
     라벨의 오른쪽 끝이 마지막 막대의 오른쪽 끝과 맞는다 */
  return `<div class="spark" aria-hidden="true">${vs.map(v=>
      `<i style="height:${(8+((v-lo)/rr)*36).toFixed(1)}px"></i>`).join("")}</div>
    <div class="stk" style="${g}"><span style="grid-column:${vs.length}">${
      E(shortM(ms[ms.length-1]))}</span></div>`;
}
const nWarn = () => P.cross.filter(c=>Math.abs(c.gap)>15).length;

function home(){
  let h=`<p class="sub">원천 API에서 직접 수집한 실측치입니다.<br>
    지표명 옆 <strong>?</strong> 를 누르면 읽는 법이 나옵니다.</p>`;
  for (const id of IND){
    const d=P.ind[id], r=defReg(id), [m,v,i]=last(id,r), s=series(id,r);
    const p = i>0 ? rate(v,s[d.months[i-1]]) : null;
    const open = !!S.help[id];
    const [fv,fu,ft] = fmtHome(id,v,d);
    h+=`<div class="row">
      <button class="rm" onclick="go('series','${id}')">
        <span class="nm">${E(d.name)}</span>
        <span class="src"><span class="tag t-a">최신 ${shortM(m)}</span> · ${E(d.src)}</span>
        <span class="btm">
          <span class="vw" style="text-align:left">
            <span class="vr" style="justify-content:flex-start"><span class="rg"
              >${E(regLabel(id,r))}</span><span class="vl">${fv}${unitTxt(fu,ft)}</span><span class="dl"
              >(전월비 ${pct(p)})</span></span>
            ${paren(id)?`<div style="margin-top:2px">${paren(id)}</div>`:""}
          </span>
          <span class="sw">${spark(id,r)}</span>
        </span>
      </button>
      <button class="qb" aria-expanded="${open}" onclick="hlp('${id}')"
        aria-label="${E(d.name)} 설명">?</button>
      ${open?`<div class="help">${HELP[id]||""}</div>`:""}
    </div>`;
  }
  h+=`<div class="foot">${stamp()}<br>
    KB부동산 · 대법원 법원경매정보 · 한국은행 ECOS · 한국부동산원 R-ONE<br>
    확인이 필요한 항목은 <strong>정보</strong> 탭의 <strong>검증</strong> 메뉴에 모아둡니다.</div>`;
  return h;
}

/* 지역 칩 + 선택 목록. 계열이 하나면 아무것도 그리지 않는다 —
   그룹 칩이 이미 "전국" 이라 말하고 있어 지역 칩이 중복이 된다 */
/* ── 지역 칩 줄 — 상세·요약이 같이 쓴다 ─────────────────────────────────
   전체 목록 드롭다운을 칩 줄 맨 앞(= 전국 앞)에 칩과 같은 크기로 세운다.
   고른 지역은 list 에 붙여 항상 눌린 칩으로 보이므로, 드롭다운의 표시 문구는
   "지역 선택" 으로 고정한다 — 선택 상태는 칩이, 전체 목록은 드롭다운이 맡는다.
   list = 칩으로 세울 지역 · all = 드롭다운에 담을 전체 지역 */
function chipRow(list,all,cur,fn,lab,style){
  if(cur && !list.includes(cur)) list=list.concat([cur]);
  const rest = all.filter(r=>!list.includes(r));
  const sel = rest.length
    ? `<select class="chip" aria-label="지역 선택" onchange="${fn}(this.value)">
        <option value="" disabled selected>지역 ▾</option>
        <optgroup label="전체 ${all.length}개">${all.map(r=>
          `<option value="${E(r)}">${E(lab(r))}</option>`).join("")}</optgroup>
       </select>` : "";
  return `<div class="chips"${style?` style="${style}"`:""}>${sel}${list.map(r=>
    `<button class="chip" aria-pressed="${r===cur}" onclick="${fn}('${E(r)}')">${
      E(lab(r))}</button>`).join("")}</div>`;
}

function regionPicker(id,gk,regs){
  if(regs.length<=1) return "";
  /* 그룹 키로 판정한다 — "수도권 계열이 있는가" 로 보면 아파트매매 거래량이
     걸린다 (거래량에도 수도권·지방권 파생 계열이 있다) */
  const zone = gk==="권역";
  const base = zone ? ZONE_ORDER.filter(z=>regs.includes(z))
                    : MAJOR.filter(r=>regs.includes(r));
  /* 권역 정의 목록은 여기 두지 않는다 — 차트 아래 물음표로 옮겼다 (detail 참조) */
  return chipRow(base,regs,S.reg,"reg",r=>labelOf(id,r));
}

function detail(){
  const id=S.ind, d=P.ind[id], gk=Object.keys(d.groups);
  if(!S.grp||!d.groups[S.grp]) S.grp=gk[0];
  const regs=d.groups[S.grp];
  if(!S.reg||!regs.includes(S.reg))
    S.reg = regs.includes("전국") ? "전국" : regs[0];
  const [m,v,i]=last(id,S.reg), s=series(id,S.reg);
  const mom=i>0?rate(v,s[d.months[i-1]]):null, yoy=i>=12?rate(v,s[d.months[i-12]]):null;

  /* 탭 라벨은 약칭이 아니라 전체 이름 — 약칭만으로는 지표가 구분되지 않는다 */
  let h=`<div class="chips">${IND.map(x=>
    `<button class="chip" aria-pressed="${x===id}" onclick="pick('${x}')">${E(P.ind[x].name)}</button>`
  ).join("")}</div>
    <div class="nm" style="margin:15px 0 0">${E(d.name)}</div>`;

  if(gk.length>1) h+=`<div class="chips">${gk.map(k=>
    `<button class="chip" aria-pressed="${k===S.grp}" onclick="grp('${E(k)}')">${E(k)} <span style="opacity:.55">${d.groups[k].length}</span></button>`
  ).join("")}</div>`;
  h+=regionPicker(id,S.grp,regs);

  h+=`<div style="display:flex;align-items:flex-end;gap:14px;padding:14px 0 20px">
    <div style="flex:1;min-width:0">
      <div class="mt">${E(labelOf(id,S.reg))} · ${shortM(m)}</div>
      <div class="big">${fmt(v,d)}${unit(d)}${paren(id)}</div></div>
    <div style="text-align:right;line-height:1.75">
    <div>전월비 ${pct(mom)}</div><div>전년동월비 ${pct(yoy)}</div></div></div>`;

  const ms=d.months.filter(x=>s[x]!=null), win=ms.slice(-13), vs=win.map(x=>s[x]);
  if(vs.length) h+=chart(id,win,vs,d,true);

  /* 지역별 신뢰도 등급은 내렸다 — 외부 대조 계열을 더 쓰지 않기로 해 갱신할
     수단이 없고, 값 자체의 품질 표시로 오독됐다. 대신 이 계열에 우리가 실제로
     한 일(이상치 제거)을 물음표에 접어두고 검증 탭에서 전량 공개한다.
     차트와 표 사이에 둔다 — 값을 본 직후, 과거자료를 보기 전에 짚어야
     "왜 사내 수치와 다른가" 라는 의문이 아래 표를 읽기 전에 풀린다 */
  if(id==="auction"){
    const rm=(P.removed||[]).filter(x=>x.region===S.reg), open=!!S.ahelp;
    h+=`<div class="row" style="border:0">
      <button class="zq" aria-expanded="${open}" onclick="ahlp()">
        <span>사내 경락가율과는 차이가 있습니다</span><span class="qb st">?</span></button>
      ${open?`<div class="help" style="margin:2px 0 13px"><b>사내 경락가율(인포케어 자료)과는
        차이가 있습니다.</b><br>아파트 · 시군구 단위
        <b>이상치 제거</b> 적용 — ${rm.length
          ? `${E(labelOf(id,S.reg))}에서 <b>${rm.length}건</b> 제거했습니다.`
          : `${E(labelOf(id,S.reg))}은 제거된 건이 없습니다.`}
        시군구 경락율이 40~160% 밖이거나 13개월 롤링 중위값에서 3·MAD 이상 벗어난
        달을 걸러냅니다. 뺀 내역은
        <button class="lk" onclick="go('check')">검증 메뉴</button>에 전량 남겨둡니다.</div>`:""}
    </div>`;
  }

  /* 권역 정의는 칩 밑에 6줄 목록으로 깔면 정작 볼 차트를 화면 밖으로 민다.
     홈 화면의 물음표와 같은 방식으로 고른 권역 하나만 접어 둔다 */
  if(S.grp==="권역" && ZONE_DESC[S.reg]){
    const open=!!S.zhelp;
    h+=`<div class="row" style="border:0">
      <button class="zq" aria-expanded="${open}" onclick="zhlp()">
        <span>*${E(S.reg)}</span><span class="qb st">?</span></button>
      ${open?`<div class="help" style="margin:2px 0 13px">${E(ZONE_DESC[S.reg])}</div>`:""}
    </div>`;
  }

  /* 과거자료는 연도별로 접지 않고 한 목록으로 편다 — 접기 단계가 조회를 늘린다 */
  const show = S.past ? ms.slice().reverse() : ms.slice(-13).reverse();
  h+=`<div class="scroll"><table class="hist"><thead><tr><th>월</th><th>값${
    d.unit?` (${E(d.unit)})`:""}</th><th>전월비</th><th>전년동월비</th>
    </tr></thead><tbody>`;
  for(const mm of show){
    const k=d.months.indexOf(mm);
    h+=`<tr><td>${shortM(mm)}</td>
      <td style="font-weight:600">${fmt(s[mm],d)}</td>
      <td>${pct(k>0?rate(s[mm],s[d.months[k-1]]):null)}</td>
      <td>${pct(k>=12?rate(s[mm],s[d.months[k-12]]):null)}</td></tr>`;
  }
  h+=`</tbody></table></div>
    <button class="more" onclick="S.past=!S.past;keep()">
      <span>${S.past?"최근 13개월만":`전체 ${ms.length}개월 보기`} ${S.past?"▴":"▾"}</span></button>
    <button class="more" onclick="downloadCsv('${id}')">
      <span>엑셀로 다운받기 ⬇</span></button>
    <div class="foot">출처 ${E(d.src)} · 계열 ${Object.keys(d.series).length}개</div>`;
  return h;
}

/* ── 상세 화면 "엑셀로 다운받기" — 지금 고른 지표·지역의 전체 월별 자료를
   CSV 로 내려받는다. Excel 이 UTF-8 을 코드페이지로 오인하지 않도록 BOM 을
   앞에 붙인다. 값은 화면 표시용 toLocaleString(콤마) 대신 순수 숫자로 써서
   Excel 이 텍스트가 아니라 숫자로 바로 읽게 한다 */
function csvCell(v){
  const s=String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
async function downloadCsv(id){
  const d=P.ind[id], r=S.reg, s=series(id,r);
  const ms=d.months.filter(m=>s[m]!=null);
  const rows=[["월","값"+(d.unit?` (${d.unit})`:""),"전월비(%)","전년동월비(%)"]];
  for(const mm of ms){
    const k=d.months.indexOf(mm);
    const mom=k>0?rate(s[mm],s[d.months[k-1]]):null;
    const yoy=k>=12?rate(s[mm],s[d.months[k-12]]):null;
    const val=d.nd===0?Math.round(s[mm]):s[mm].toFixed(d.nd);
    rows.push([shortM(mm).replace(/^'/,""), val,
      mom==null?"":mom.toFixed(2), yoy==null?"":yoy.toFixed(2)]);
  }
  const csv=String.fromCharCode(0xFEFF)+rows.map(row=>row.map(csvCell).join(",")).join("\r\n");
  const stem=`${d.short}_${labelOf(id,r)}`;
  /* Artifact 뷰어는 <a download> 를 통째로 무시한다 — 로컬 파일에서는 되고
     폰(claude.ai)에서는 죽는 버튼이 된다. 뷰어가 주는 downloads 권한을
     먼저 쓰고, 없을 때만 종전 Blob 경로로 되돌아간다. */
  const dl = (window.claude && window.claude.use)
           ? await window.claude.use("downloads").catch(()=>null) : null;
  if(dl){
    /* csv 는 확장 허용목록이라 뷰에 따라 거절된다 — 그때는 내용 그대로
       .txt 로 한 번 더 청한다. 사용자가 거절한 경우는 조용히 넘긴다. */
    try{ await dl.save({filename:stem+".csv", data:csv}); }
    catch(e){
      if(e && e.code==="extension_not_enabled"){
        try{ await dl.save({filename:stem+".txt", data:csv}); }
        catch(e2){ if(!e2||e2.code!=="declined") console.warn("저장 실패",e2); }
      } else if(!e||e.code!=="declined"){ console.warn("저장 실패",e); }
    }
    return;
  }
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=stem+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ── 요약 화면 지역 선택 ───────────────────────────────────────────────
   표준 시도명으로 칩을 세우고, 지표별 계열명이 다른 경우만 별칭으로 잇는다.
   이름으로 계열을 찾는 건 위험하지만(FR-19) 이 목록은 시도 레벨이라 중복이
   없다 — 중복이 있는 시군구 계열은 이 화면에 세우지 않는다. */
const SIDO = ["전국","서울","경기","인천","부산","대구","광주","대전","울산","세종",
              "강원","충북","충남","전북","전남","경북","경남","제주","전남광주"];
/* KB 평균가격은 26.7 행정구역 개편 전 계열을 (구) 접두로 남겨두었다 */
const ALIAS = { avg: {"전남":"(구)전라남도"} };
function resolve(id,r){
  const d=P.ind[id];
  if(d.series[r]) return r;
  const a=(ALIAS[id]||{})[r];
  return (a && d.series[a]) ? a : null;
}

/* ── 인사이트 — 전부 표시된 계열에서 계산한다. 없으면 안 쓴다 ───────────── */
function insights(id,r,ms,vs,d,spName){
  const n=vs.length;
  if(n<3) return [];
  const cur=vs[n-1], prev=vs[n-2], sgn=Math.sign(cur-prev);
  const hi=Math.max(...vs), lo=Math.min(...vs);
  const hiI=vs.lastIndexOf(hi), loI=vs.lastIndexOf(lo);
  const C=[];   // [우선순위, 문구]

  // 1) 기간 내 최고·최저 경신 — 가장 눈여겨볼 사건
  if(hiI===n-1 && n>3)
    C.push([95,`<b>${spName} 최고치</b> — 직전 최고 ${fmt(Math.max(...vs.slice(0,-1)),d)}${unit(d)} 경신`]);
  if(loI===n-1 && n>3)
    C.push([95,`<b>${spName} 최저치</b> — 직전 최저 ${fmt(Math.min(...vs.slice(0,-1)),d)}${unit(d)} 하회`]);

  // 2) 연속 상승·하락
  let run=0;
  if(sgn!==0) for(let k=n-1;k>0;k--){ if(Math.sign(vs[k]-vs[k-1])===sgn) run++; else break; }
  if(run>=3){
    const acc=(cur/vs[n-1-run]-1)*100;
    C.push([85,`<b>${run}개월 연속 ${sgn>0?"상승":"하락"}</b> (누적 ${
      (acc>=0?"+":"")+acc.toFixed(2)}%)`]);
  }

  // 3) 방향 전환 — 직전 흐름이 꺾인 달
  if(run===1&&n>=4){
    const bf=Math.sign(vs[n-2]-vs[n-3]);
    if(bf!==0&&bf!==sgn) C.push([80,`<b>${sgn>0?"하락→상승":"상승→하락"} 전환</b>`]);
  }

  // 4) 변동폭 이례 — 평시 월간 변동 대비
  const df=[]; for(let k=1;k<n;k++) df.push(Math.abs(vs[k]-vs[k-1]));
  const av=df.reduce((a,b)=>a+b,0)/df.length;
  if(av>0){
    const x=Math.abs(cur-prev)/av;
    if(x>=2.5) C.push([70,`전월비 변동폭이 평시의 <b>${x.toFixed(1)}배</b>`]);
    else if(x<=0.2&&n>6) C.push([40,`전월비 변동이 평시의 ${x.toFixed(1)}배 — <b>정체</b>`]);
  }

  // 6) 아파트매매 거래량은 지수가 아니라 건수라 추상적인 배율보다 실제
  // 증감 건수가 더 와닿는다 — 다른 신호가 없을 때 채워 넣는 구체적 수치
  if(id==="trx_apt"){
    const diff=Math.round(cur-prev);
    C.push([60,`전월비 <b>${diff>=0?"+":""}${diff.toLocaleString("ko-KR")}호</b> ${diff>=0?"증가":"감소"}`]);
  }

  // 5) 전국 대비 — 지역을 골랐을 때만
  if(r!=="전국"&&P.ind[id].series["전국"]){
    const ns=P.ind[id].series["전국"], a=ns[ms[0]], b=ns[ms[n-1]];
    if(a!=null&&b!=null&&a!==0&&vs[0]!==0){
      const sg=x=>(x>=0?"+":"")+x.toFixed(2)+"%";
      const gl=(b/a-1)*100, lc=(cur/vs[0]-1)*100, gp=lc-gl;
      if(Math.sign(gl)!==Math.sign(lc)&&Math.abs(gl)>=1&&Math.abs(lc)>=1)
        C.push([88,`같은 기간 <b>전국과 방향이 반대</b> — ${E(r)} ${sg(lc)} · 전국 ${sg(gl)}`]);
      else if(Math.abs(gp)>=2)
        C.push([75,`같은 기간 전국 ${sg(gl)} 대비 <b>${
          (gp>=0?"+":"")+gp.toFixed(2)}%p ${gp>=0?"앞섬":"뒤짐"}</b>`]);
    }
  }
  return C.sort((a,b)=>b[0]-a[0]).slice(0,2).map(x=>x[1]);
}

/* ── 차트 — 상세·요약이 같이 쓴다 ──────────────────────────────────────
   라벨행·막대행·눈금행을 같은 그리드로 깔아 열을 맞춘다.
   라벨을 다는 칸은 세 종류다 — 최신월·최고·최저·하단 눈금(마감월)이 있는 달.
   최고·최저만 「최고 100」처럼 문구를 앞에 붙이고 나머지는 수치만 쓴다.
   라벨 폭만큼 칸을 확보하지 못하면 우선순위가 낮은 쪽을 버린다 — 겹쳐 읽히면
   라벨이 없느니만 못하다. */
function chart(id,ms,vs,d,big){
  const n=vs.length, lo=Math.min(...vs), hi=Math.max(...vs), rr=(hi-lo)||1;
  const hiI=vs.lastIndexOf(hi), loI=vs.lastIndexOf(lo);
  const gap=n>24?1:(n>12?2:3);
  const g=`grid-template-columns:repeat(${n},1fr);gap:${gap}px`;
  const isTick=k=>(k===n-1||k===0||((n-1-k)%12===0));

  const want=[[n-1,"cur"]];
  if(hiI!==n-1) want.push([hiI,"hi"]);
  if(loI!==n-1) want.push([loI,"lo"]);
  for(let k=0;k<n;k++) if(isTick(k)&&k!==n-1&&k!==hiI&&k!==loI) want.push([k,"tk"]);

  const STY={cur:"color:var(--w700);font-weight:600",
             hi:"color:var(--a700);font-weight:600",
             lo:"color:var(--n600)", tk:"color:var(--n700)"};
  const PRE={cur:"",hi:"최고 ",lo:"최저 ",tk:""};
  /* 라벨의 실제 글자폭으로 겹침을 본다 (textW). 칸 수로 어림하면 「최고 116,880」과
     「102.17」이 같은 폭으로 취급돼 짧은 라벨끼리도 함께 버려진다.
     그래도 안 들어가는 라벨은 버리지 않고 윗줄로 올린다 — 최고·최저가 두세 칸
     이내로 붙은 달은 한 줄에 둘 다 세울 방법이 물리적으로 없다 (13개월 차트에서
     라벨 두 개면 폭이 칸 간격의 두 배를 넘는다). 겹쳐 쓰느니 층을 나눈다. */
  const colw = W_CHART/n;
  const putA=new Map(), putB=new Map();
  const fits=(mp,k,w)=>{
    for(const [q,e] of mp) if(Math.abs(q-k)*colw < (w+e[3])/2) return false;
    return true;
  };
  for(const [k,kind] of want){
    const pre=PRE[kind], num=fmt(vs[k],d);
    /* 최고·최저는 접두사와 수치를 두 줄로 나눠 쓴다 — 겹침 판정 폭은 실제로
       나란히 놓이는 두 줄 중 더 넓은 쪽이다 (합친 한 줄 폭이 아니다) */
    const w = pre ? Math.max(textW(pre.trim(),big),textW(num,big)) : textW(num,big);
    if(fits(putA,k,w)) putA.set(k,[kind,pre,num,w]);
    else if(fits(putB,k,w)) putB.set(k,[kind,pre,num,w]);
  }

  /* 라벨을 막대(<i>) 안 자식으로 넣고 bottom:100% 로 그 막대 꼭대기 바로 위에
     앉힌다 — 막대 높이가 바뀌면 라벨도 같이 움직인다. 겹쳐서 위 줄로 올린
     라벨(putB)은 bottom 을 한 칸 더 띄워 그 위에 쌓는다 */
  const lab=(mp,k,edge,bottom)=>{
    const kd=mp.get(k);
    if(!kd) return "";
    const [kind,pre,num]=kd;
    const body=pre?`${E(pre.trim())}<br>${E(num)}`:E(num);
    return `<span class="gv${big?" d":""}" style="bottom:${bottom};${edge};${
      STY[kind]}">${body}</span>`;
  };
  let B="",T="";
  /* 최고·최저가 두 줄이 되면서 한 줄일 때보다 키가 커졌다 — 위 줄(putB)이
     아래 줄(putA)의 두 줄짜리 라벨과 겹치지 않도록 여유를 그만큼 늘렸다 */
  const stack=big?30:26;
  const hArr=[];
  for(let k=0;k<n;k++){
    const isLast=k===n-1;
    const al=k===0?"flex-start":(isLast?"flex-end":"center");
    const edge=k===0?"left:0":(isLast?"right:0":"left:50%;transform:translateX(-50%)");
    /* 높이를 %로 준다 — .gb 가 좁은 화면에서 78px 로 줄어도 넘치지 않는다 */
    const h=9+((vs[k]-lo)/rr)*91;
    hArr[k]=h;
    const laA=lab(putA,k,edge,"100%");
    const laB=lab(putB,k,edge,`calc(100% + ${stack}px)`);
    B+=`<i class="${isLast?"last":""}" style="height:${h.toFixed(1)}%">${laB}${laA}</i>`;
    T+=`<span class="gt" style="justify-content:${al}">${isTick(k)?E(shortM(ms[k])):""}</span>`;
  }
  /* 라벨은 자기 막대 꼭대기(bottom:100%, 필요하면 +stack) 를 기준으로 위로
     자란다. 막대가 그 차트의 최고치(높이 100%)에 가까울수록 .gb 상단 밖으로
     튀어나갈 여지가 커진다 — 실제로 튀어나오는 만큼만 차트 앞에 여유 공간을
     둔다(=1). 픽셀 폭 .gb 높이(96px)는 최고치 막대에서는 상쇄되므로 필요
     없다 — 두 코드가 같은 결론에 닿는지 여러 지표·기간에서 실측으로 맞췄다 */
  const lineH=(big?11.5:10)*1.3;
  let need=0;
  for(const [k,e] of putA) need=Math.max(need,(e[1]?2:1)*lineH-(100-hArr[k])/100*96);
  for(const [k,e] of putB) need=Math.max(need,stack+(e[1]?2:1)*lineH-(100-hArr[k])/100*96);
  const topGap = need>0 ? Math.ceil(need+4) : 0;
  return `<div class="gc gb" style="${g};margin-top:${topGap}px">${B}</div>
    <div class="gc" style="${g}">${T}</div>`;
}

/* ── 관련 기사 ─────────────────────────────────────────────────────────
   빌드 때 받아둔 기사별 URL 을 그대로 건다 — 검색 결과에서 한 번 더 고르게
   하지 않는다. 목록이 비면(외부망 차단·수집 실패) 검색 링크로 되돌아간다. */
function newsBlock(id){
  const list=(P.news&&P.news.items&&P.news.items[id])||[];
  if(list.length){
    /* 검색창은 지표마다 다르다 — 기사가 드문 지표(평균 매매가격)는 수집기가
       45→90→180일로 넓혀 잡는다. 전부 45일이라 쓰면 넓힌 지표에서 거짓말이 된다 */
    const days=(P.news.spans&&P.news.spans[id])||P.news.window_days;
    return `<div class="news art">${list.map(a=>
      `<a href="${E(a.u)}" target="_blank" rel="noopener noreferrer">
        <span class="nt">${E(a.t)}</span>
        <span class="np">${E(a.p)}${a.d?" · "+E(a.d):""}</span></a>`).join("")}</div>
      <div class="mt" style="margin-top:6px">주요 언론사 기준 최근 ${days}일 · ${
        E(P.news.fetched)} 수집</div>`;
  }
  return `<div class="news">${(NEWS[id]||[]).map(q=>
    `<a href="https://news.google.com/search?q=${encodeURIComponent(q)}&hl=ko&gl=KR&ceid=KR:ko"
        target="_blank" rel="noopener noreferrer">▸ ${E(q)} 뉴스</a>`).join("")}</div>`;
}

function summary(){
  const sp=S.span, spName=({6:"6개월",12:"1년",36:"3년",60:"5년"})[sp];
  let h=`<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 4px">
      <div class="sub" style="flex:1;min-width:150px;margin:0">지역과 기간을 고르면<br>
        차트·분석요약이 함께 바뀝니다.</div>
      <div class="chips" style="margin:0">${SPANS.map(([n,l])=>
        `<button class="chip" aria-pressed="${n===sp}" onclick="span(${n})">${l}</button>`
      ).join("")}</div></div>
    ${chipRow(MAJOR.filter(r=>SIDO.includes(r)),SIDO,S.sreg,"sreg",r=>r,
      "margin-top:15px;padding-top:14px;border-top:1px solid var(--rule)")}`;

  for(const id of IND){
    const d=P.ind[id];
    /* 소비자물가지수는 전국 단일 계열 — 지역 선택을 받지 않는다 */
    const r = id==="cpi" ? "전국" : resolve(id,S.sreg);
    if(!r){
      h+=`<div style="padding:16px 0;border-top:1px solid var(--hair)">
        <div class="nm sm">${E(d.name)}${paren(id)}</div>
        <div class="mt">${E(S.sreg)} 계열이 없습니다 — 원천이 이 지역을 공표하지 않습니다.</div></div>`;
      continue;
    }
    const s=series(id,r);
    const ms=d.months.filter(m=>s[m]!=null).slice(-sp), vs=ms.map(m=>s[m]);
    if(!vs.length) continue;
    const ins=insights(id,r,ms,vs,d,spName);
    h+=`<div style="padding:16px 0 4px;border-top:1px solid var(--hair)">
      <div style="display:flex;align-items:baseline;gap:10px">
        <div class="nm sm" style="flex:1">${E(d.name)}${paren(id)}</div>
        <div style="font-weight:600;font-size:19px;white-space:nowrap">${
          id==="cpi"?"":`<span class="rg">${E(r)}</span> `}${fmt(vs[vs.length-1],d)}${unit(d)}</div></div>
      ${ins.length?`<ul class="ins">${ins.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
      ${chart(id,ms,vs,d)}
      <button class="more" onclick="nws('${id}')" aria-expanded="${!!S.news[id]}">
        <span>관련 뉴스보기 ${S.news[id]?"▴":"▾"}</span></button>
      ${S.news[id]?newsBlock(id):""}
    </div>`;
  }
  h+=`<div class="foot">인사이트는 <strong>표시된 계열에서 계산한 사실</strong>만 씁니다 —
    최고·최저 경신, 연속 방향, 전환, 평시 대비 변동폭, 전국과의 격차·방향 차이.
    해석·전망은 넣지 않습니다.<br><br>
    ${P.news&&P.news.fetched
      ? `관련 기사는 <strong>주요 언론사</strong>(종합일간·통신·경제지)로 골라뒀습니다 —
         제목을 누르면 검색 결과가 아니라 <strong>그 기사로 바로</strong> 이동합니다.
         수치를 갱신할 때 함께 다시 받습니다.`
      : `관련 기사 목록을 받지 못해 <strong>검색 링크</strong>로 대체했습니다 —
         누를 때마다 그 시점의 최신 기사가 열립니다.`}
    링크된 내용은 당행이 검증한 것이 아닙니다.</div>`;
  return h;
}

function check(){
  let h=`<h2 class="h2lg">검증 점검</h2>
    <p class="sub">값은 자동으로 바뀌지 않습니다. 경고만 띄우고 판단은 담당자가 합니다.</p>
    <h2 class="h2lg">평균가격 교차검증</h2>
    <p class="sub">KB(저장 계열) ↔ 부동산원(보조). 조사방식이 달라 KB가 일관되게 높습니다 —
    <strong>절대 차이가 아니라 평시 편차 대비 변화</strong>로 판정합니다.</p>
    <button class="more" onclick="crossToggle()" aria-expanded="${!!S.cross}">
      <span>${S.cross?"표 접기":"표 펼치기"} ${S.cross?"▴":"▾"}</span></button>`;
  if(S.cross){
    h+=`<div class="scroll"><table><thead><tr><th>지역</th><th>KB</th><th>부동산원</th><th>편차</th>
    </tr></thead><tbody>`;
    for(const c of P.cross.slice().sort((a,b)=>b.gap-a.gap)){
      const big=Math.abs(c.gap)>15;
      h+=`<tr${big?' style="background:var(--w100)"':""}><td>${E(c.region)}</td>
        <td>${c.kb==null?"—":c.kb.toLocaleString("ko-KR")}</td>
        <td style="color:var(--n700)">${c.reb==null?"—":c.reb.toLocaleString("ko-KR")}</td>
        <td class="${big?"dn":""}">${c.gap.toFixed(1)}%p</td></tr>`;
    }
    h+=`</tbody></table></div>`;
  }
  if(P.removed.length){
    /* 이 화면이 계열의 유일한 감사 기록이다 — 우리가 원천에서 뺀 것을 전부,
       뺀 이유와 시도값이 얼마나 움직였는지까지 남긴다. 잘라 보여주지 않는다 */
    const byReg={};
    for(const r of P.removed) (byReg[r.region]=byReg[r.region]||[]).push(r);
    const regs=Object.keys(byReg).sort((a,b)=>byReg[b].length-byReg[a].length);
    h+=`<h2 class="h2lg">경락율 이상치 제거 ${P.removed.length}건</h2>
      <p class="sub">이 계열은 대법원 API 집계에 <strong>우리 규칙으로 이상치를
      걸러낸</strong> 값입니다. 무엇을 왜 뺐고 시도값이 얼마나 움직였는지 전량
      남깁니다 — 규칙은 시군구 경락율이 <strong>40~160% 밖</strong>이거나
      <strong>13개월 롤링 중위값에서 3·MAD 이상</strong> 벗어난 경우입니다.
      전체 1,343셀 중 ${P.removed.length}셀입니다.</p>`;
    for(const rg of regs){
      /* 19건을 한꺼번에 펴두면 검증 탭이 이 절 하나로 길어져 위쪽 경고가 묻힌다.
         지역 단위로 접어두고 필요한 지역만 편다 */
      const op=!!S.rmo[rg];
      h+=`<button class="rmg" aria-expanded="${op}" onclick="rmo('${E(rg)}')">
        <span class="rmn">${E(rg)}</span><span>${byReg[rg].length}건</span>
        <span class="rmx">${op?"▴":"▾"}</span></button>`;
      if(!op) continue;
      for(const r of byReg[rg]){
        const sh=Math.abs(Number(r.after)-Number(r.before));
        /* 두 단계를 구분해 쓴다 — ①시도 셀이 후보로 걸린 이유(판정사유 열)와
           ②그 안에서 이 시군구를 뺀 이유(항상 40~160% 밖)는 서로 다른 수치다.
           나란히 쓰면 후보 판정의 시도 경락율이 시군구 값으로 읽힌다 */
        const over=Number(r.rate)>160;
        h+=`<div class="rmi">
          <div class="rmh"><strong>${shortM(r.ym)} ${E(r.sgg_nm||r.sgg)}</strong>
            <span class="mt">매각 ${E(r.n)}건</span></div>
          <div class="mt">감정가 ${eok(r.aee)} · 매각가 ${eok(r.dsp)} →
            경락율 <strong style="color:var(--w700)">${E(r.rate)}%</strong>
            <span class="tag t-m" style="margin-left:4px">${
              over?"160% 초과":"40% 미만"}</span></div>
          <div class="mt">① ${E(rg)} ${shortM(r.ym)} 이 후보로 걸림 — ${E(r.why)}</div>
          <div class="mt">② 시군구로 분해해 이 건을 제외</div>
          <div class="rmr">${E(rg)} ${E(r.before)}%
            <span style="color:var(--a700)">▸</span>
            <strong>${E(r.after)}%</strong>
            <span class="mt">(${sh>=0.01?sh.toFixed(2)+"%p":"변화 없음"})</span></div>
        </div>`;
      }
    }
    h+=`<div class="foot">제거는 <strong>값을 지어내지 않습니다</strong> — 해당 시군구를
      집계에서 빼고 시도값을 다시 계산할 뿐, 다른 값으로 대체하지 않습니다 (원칙 제5조).
      물건 단위 원장이 없어 「대단지 통경매」처럼 40~160% 안에 들어오는 이상 사례는
      걸러지지 않습니다. 남은 차이는 대부분 <strong>소표본 변동</strong>이며 규칙으로
      해결되지 않습니다 — 월 단위 등락보다 <strong>3개월 이상 이동평균</strong>으로
      보십시오.</div>`;
  }
  return h;
}

/* 정보 탭 실행 기록 — Phase 1 "실행 로그를 화면에 출력" 항목이다.
   무엇이 언제 성공/실패했는지 화면에 없으면, 수집이 조용히 실패해도
   직전 값이 최신처럼 읽힌다. 그 침묵을 없애는 것이 목적이다. */
function runBlock(){
  if(!RUN) return "";
  const st=RUN["수집단계"]||[], mo=RUN["최신월"]||{}, bad=RUN["수집실패"]||[];
  let h=`<h2>실행 기록</h2>`;
  if(bad.length)
    h+=`<div class="alert">수집 실패 ${bad.length}건 — ${E(bad.join(', '))}.
      해당 지표는 <strong>직전에 받아둔 값</strong>을 그대로 표시합니다 —
      값을 지어내지 않습니다.</div>`;
  h+=`<p class="sub">수집 <strong>${E(RUN_AT||"—")}</strong>`
     + (RUN["수집소요초"]!=null?` · ${Math.round(RUN["수집소요초"])}초`:"")
     + ` · 화면 생성 <strong>${E(P.generated)}</strong>`
     + (RUN["렌더소요초"]!=null?` · ${RUN["렌더소요초"]}초`:"") + `</p>`;
  if(st.length){
    h+=`<div class="scroll"><table><thead><tr><th>단계</th><th>상태</th>
      <th>소요</th></tr></thead><tbody>`;
    for(const r of st)
      h+=`<tr><td>${E(r["단계"])}</td><td${r["상태"]!=="성공"?' class="dn"':""}>
        ${E(r["상태"])}</td><td>${Number(r["소요초"]).toFixed(1)}초</td></tr>`;
    h+=`</tbody></table></div>`;
  }
  const ks=Object.keys(mo);
  if(ks.length)
    h+=`<p class="sub">원천별 최신월 — `
       + ks.map(k=>`${E(k)} <strong>${E(String(mo[k]||"없음"))}</strong>`).join(" · ")
       + `. 공표 시차가 원천마다 달라 서로 다른 것이 정상입니다.</p>`;
  return h;
}
/* 정보 탭 하위 메뉴 — 검증을 여기로 넣고 아래 탭 자리는 뉴스에 내준다.
   검증은 매일 보는 화면이 아니라 경고가 뜰 때 들어가는 화면이라, 상시
   자리를 차지하기보다 정보 탭 안에 두고 배지로 부르는 편이 맞다. */
const ASEC=[["info","정보"],["check","검증"]];
function about(){
  const sec = S.sec==="check" ? "check" : "info", n=nWarn();
  const menu=`<div class="chips" style="margin:0 0 12px">${ASEC.map(([k,l])=>
    `<button class="chip" aria-pressed="${k===sec}" onclick="asec('${k}')">${l}${
      k==="check"&&n?` <span class="bd">${n}</span>`:""}</button>`).join("")}</div>`;
  return menu + (sec==="check" ? check() : aboutInfo());
}
function aboutInfo(){
  return `<h2>이 페이지</h2>
    <div class="card"><div style="font-weight:600;font-size:16px">외부지표 자동수집 대시보드</div>
    <div class="mt" style="margin-top:7px">${stamp()}<br>
    원천 API에서 직접 수집한 실측 데이터입니다. 목업이 아닙니다.</div></div>
    ${runBlock()}
    <h2>원천</h2>` +
    IND.map(id=>{const d=P.ind[id], url=SRC_URL[id], op=!!S.src[id];
      return `<button class="srow" aria-expanded="${op}" onclick="srco('${id}')">
        <span style="flex:1"><span class="nm" style="font-size:15px">${E(d.name)}</span>
        <span class="mt" style="display:block">${E(d.src)}</span></span>
        <span class="mt">${Object.keys(d.series).length}계열</span>
        <span class="qb st">${op?"▴":"▾"}</span></button>${
        op&&url?`<div class="help" style="margin:-4px 0 10px">
          <a href="${E(url)}" target="_blank" rel="noopener noreferrer">${E(url)}</a></div>`:""}`
      }).join("") +
    `<h2>읽을 때 주의</h2><p class="sub">
    <strong>기본값은 전국입니다.</strong> 지역별 값은 지표 상세 화면에서 고릅니다 —
    소비자물가지수는 전국 단일 계열만 공표됩니다.<br><br>
    <strong>㎡당 평균가격(시군구 162계열)은 수집하되 화면에서 내렸습니다.</strong>
    지역코드가 유일 키인 계열이라(동구 6개·중구 6개 중복) 이름으로 식별하면 조용히
    다른 지역에 붙습니다 — 필요해지면 그 규칙을 지킨 채 되살립니다.<br><br>
    <strong>경락율은 시도별 매각건수가 월 7~307건입니다.</strong> 표본이 적은 달은
    한두 건에 값이 흔들립니다 — 월 등락보다 3개월 이상 이동평균으로 보십시오.
    우리가 걸러낸 이상치는 <strong>검증 메뉴에 전량</strong> 남겨두었습니다.<br><br>
    <strong>지표별 최신월이 다릅니다.</strong> 공표 시차가 원천마다 달라 정상입니다.</p>
    <div class="foot">외부 유래 문자열은 전부 이스케이프하고, 임베드 전 도메인 검증을 거칩니다.
    개인정보는 수집하지 않습니다 — 공개 통계만 다룹니다.</div>`;
}

/* ── 뉴스 탭 — 가계부채·대출 정책 기사 ──────────────────────────────
   언론사 범위는 요약 탭의 관련 기사와 **같은 주요 언론사**다 (fetch_news.py
   의 MAJOR 하나를 두 화면이 같이 쓴다). 범위를 따로 두면 한 화면에서
   "주요 언론사" 가 두 가지를 뜻하게 된다. */
function newsTab(){
  const pol=(P.news&&P.news.policy)||null, all=(pol&&pol.items)||[];
  const kws=(pol&&pol.keywords)||[];
  if(!all.length)
    return `<h2 class="h2lg">가계부채·대출 정책 기사</h2>
      <p class="sub">기사 목록을 받지 못했습니다 — 수집이 실패했거나 최근
        <strong>${(pol&&pol.days)||30}일</strong> 안에 해당 키워드 기사가 없습니다.
        <strong>없는 것을 지어내지 않습니다.</strong></p>
      ${kws.length?`<p class="sub">키워드 — ${kws.map(E).join(" · ")}</p>`:""}`;
  const cnt={};
  for(const a of all) for(const k of (a.k||[])) cnt[k]=(cnt[k]||0)+1;
  const cur = S.kw && kws.includes(S.kw) ? S.kw : null;
  /* 펼침 상태(S.cl)는 전체 목록의 인덱스로 잡는다 — 필터를 바꿔도 어느
     묶음을 폈는지가 유지된다 */
  const idx = all.map((a,i)=>({a,i}));
  const list = cur ? idx.filter(({a})=>(a.k||[]).includes(cur)) : idx;
  /* 수집기가 최신 N묶음으로 자른 경우 전체 묶음 수를 같이 적는다 — 잘린 것을
     감추면 "30일 전부" 로 읽힌다 */
  const grp=(pol.groups||all.length);
  const arts=(pol.articles||all.reduce((n,a)=>n+1+((a.rel||[]).length),0));
  let h=`<h2 class="h2lg">가계부채·대출 정책 기사</h2>
    <p class="sub">주요 언론사 기준 최근 <strong>${pol.days}일</strong> · 기사
      ${arts}건을 <strong>${all.length}개 묶음</strong>으로${
      grp>all.length?` (전체 ${grp}묶음 중 최신 ${all.length}개)`:""} · ${
      E(P.news.fetched)} 수집</p>
    <div class="chips">
      <button class="chip sm" aria-pressed="${!cur}" onclick="kwp('')">전체 ${all.length}</button>${
      kws.map(k=>`<button class="chip sm" aria-pressed="${k===cur}" onclick="kwp('${E(k)}')">${
        E(k)} ${cnt[k]||0}</button>`).join("")}</div>`;
  if(!list.length)
    h+=`<p class="sub">${E(cur)} 기사는 최근 ${pol.days}일 안에 없습니다.</p>`;
  else
    h+=`<div class="news art">${list.map(({a,i})=>{
      const rel=a.rel||[], op=!!S.cl[i];
      return `<a href="${E(a.u)}" target="_blank" rel="noopener noreferrer">
        <span class="nt">${E(a.t)}<span class="kwt">${(a.k||[]).map(E).join(" · ")}</span></span>
        <span class="np">${E(a.p)}${a.d?" · "+E(a.d):""}</span></a>` + (rel.length
        ? `<button class="relb" onclick="clt(${i})" aria-expanded="${op}">관련 기사 ${
             rel.length}건 ${op?"▴":"▾"}</button>${op?`<div class="rel">${rel.map(r=>
             `<a href="${E(r.u)}" target="_blank" rel="noopener noreferrer">
               <span class="nt">${E(r.t)}</span>
               <span class="np">${E(r.p)}${r.d?" · "+E(r.d):""}</span></a>`).join("")}</div>`:""}`
        : "");
    }).join("")}</div>`;
  h+=`<div class="foot">키워드 ${kws.length}개(${kws.map(E).join(" · ")})가
    <strong>제목에</strong> 들어간 기사만 모았습니다 — 본문 일치는 넣지 않았고,
    해외 기사는 뺐습니다. 언론사 범위는 요약 탭의 관련 기사와 같습니다.<br><br>
    같은 사안을 여러 언론사가 낸 기사는 <strong>제목이 비슷한 것끼리 묶어</strong>
    대표 한 건만 펴두었습니다 — 제목을 크게 고쳐 쓴 기사는 같은 사안이어도
    따로 남습니다. 묶음은 제목만으로 판단하며 기사 본문은 읽지 않습니다.<br><br>
    링크된 내용은 당행이 검증한 것이 아닙니다.</div>`;
  return h;
}

const TABS=[["home","홈","▤"],["series","상세","▚"],["summary","요약","▧"],
            ["news","뉴스","▩"],["about","정보","ⓘ"]];
const TITLE={home:"부동산 외부지표 모니터링",series:"상세지표",summary:"요약 및 뉴스",
             news:"뉴스",check:"검증 점검",about:"정보"};
/* 화면 안에서 접었다 펴는 조작은 스크롤을 그대로 둔다 — 목록 아래쪽 항목을
   폈는데 맨 위로 튀면 방금 누른 것을 다시 찾아 내려와야 한다 */
function keep(){const y=window.scrollY; render(); window.scrollTo(0,y);}
function render(){
  const app=document.getElementById("app");
  app.innerHTML =
    S.tab==="home"?home():S.tab==="series"?detail():
    S.tab==="summary"?summary():S.tab==="news"?newsTab():about();
  app.className = (S.tab==="home"||S.tab==="summary") ? "pt" : "";
  const t=document.getElementById("ttl");
  t.textContent = TITLE[S.tab];
  t.className = S.tab==="home" ? "lg" : "";
  document.getElementById("eb").textContent =
    S.tab==="home" ? stampShort() : "";
  const n=nWarn();
  document.getElementById("tabs").innerHTML = TABS.map(([k,l,ic])=>
    `<button ${S.tab===k?'aria-current="page"':""} onclick="go('${k}')">
      <span class="ic" aria-hidden="true">${ic}</span><span>${l}</span>${
      k==="about"&&n?`<span class="bd">${n}</span>`:""}</button>`).join("");
  window.scrollTo(0,0);
}
/* 검증은 정보 탭 안의 메뉴가 됐다. 본문 안내 버튼의 옛 호출 go("check") 를
   그대로 받아 정보 탭 + 검증 메뉴로 보낸다 */
function go(t,id){
  if(t==="check"){S.tab="about";S.sec="check";} else {S.tab=t;}
  if(id){S.ind=id;S.reg=null;S.grp=null;S.past=false;}
  render();
}
function asec(k){S.sec=k;render();}
function kwp(k){S.kw=k||null;render();}
/* 묶음 펼치기는 스크롤을 그대로 둔다 — 목록 아래쪽을 폈는데 맨 위로 튀면
   방금 누른 묶음을 다시 찾아 내려와야 한다 */
function clt(i){S.cl[i]=!S.cl[i];keep();}
function pick(id){S.ind=id;S.reg=null;S.grp=null;S.past=false;render();}
function grp(g){S.grp=g;S.reg=null;render();}
function reg(r){if(!r)return;S.reg=r;render();}
function span(n){S.span=n;render();}
function hlp(id){S.help[id]=!S.help[id];keep();}
function zhlp(){S.zhelp=!S.zhelp;keep();}
function ahlp(){S.ahelp=!S.ahelp;keep();}
function rmo(g){S.rmo[g]=!S.rmo[g];keep();}
function srco(id){S.src[id]=!S.src[id];keep();}
function crossToggle(){S.cross=!S.cross;keep();}
function nws(id){S.news[id]=!S.news[id];keep();}
function sreg(r){if(!r)return;S.sreg=r;render();}
render();
/* 웹폰트가 늦게 붙으면 첫 렌더의 라벨 폭은 폴백 세리프 기준이다 — 폰트가
   자리잡은 뒤 캐시를 비우고 한 번 다시 잰다 */
if(document.fonts&&document.fonts.ready)
  document.fonts.ready.then(()=>{_wm={};render();});
</script>
</body>
</html>
